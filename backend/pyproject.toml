[project]
name = "gura-chat-backend"
version = "0.1.0"
description = "FastAPI backend for the Gura AI Live2D voice chat website"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-dotenv>=1.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9",
  "websockets>=12",
  "numpy>=1.26",
  "soundfile>=0.12",
  "edge-tts>=7.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM117", "E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
